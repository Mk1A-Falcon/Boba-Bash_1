<!DOCTYPE html> <!--This tells the browser that the currently selected file is a html file, if you do not use this tag, it really wouldn't matter but the browser would refer to an older deciprecated version of html-->

<!--HTML BASICS-->
<!-- HTML TAGS are anything that define the structure of the actual webpage-->
<!--For example there isn't a direct way to copy paste an image into the webpage's code, for this we use the <img> element (image)-->
<!--HTML DOES NOT REQUIRE PROPER INDENTATION!-->
<!--That means there isn't a specefic ratio of spaces/tab/new_line required between two or more elements/subelements-->
<html>   <!--This would mark the start of the html page itself,<html> is a basic defining html tag-->
  <head>

  </head>
  <body>

  </body>
</html>
